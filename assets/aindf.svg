<svg xmlns="http://www.w3.org/2000/svg" width="724" height="420" viewBox="0 0 724 420" role="img" aria-label="AINDF">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="724" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="50%" stop-color="#101014"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <radialGradient id="glow" cx="28%" cy="22%" r="46%">
      <stop offset="0%" stop-color="#E5484D" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#E5484D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="82%" cy="78%" r="44%">
      <stop offset="0%" stop-color="#8A38F5" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#8A38F5" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip">
      <rect width="724" height="420" rx="32" ry="32"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="724" height="420" fill="url(#bg)"/>
    <rect width="724" height="420" fill="url(#glow)"/>
    <rect width="724" height="420" fill="url(#glow2)"/>
    <rect x="0.5" y="0.5" width="723" height="419" rx="31.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.06"/>

    <text x="48" y="58" fill="#909099" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="0.16em">SPECIFICATION</text>

    <text x="48" y="128" fill="#F2F2F4" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="52" font-weight="560" letter-spacing="-0.04em">AINDF</text>
    <text x="48" y="168" fill="#A6A6B0" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="400">Design systems agents can validate.</text>
    <text x="48" y="196" fill="#909099" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="16">Tokens · slots · patterns · JSON Schemas.</text>

    <!-- suprematist mark, dark field -->
    <g transform="translate(48 228)">
      <rect width="628" height="76" rx="16" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-opacity="0.05"/>
      <rect x="24" y="18" width="40" height="40" fill="#E5484D"/>
      <circle cx="108" cy="38" r="20" fill="#F2F2F4" fill-opacity="0.92"/>
      <rect x="148" y="14" width="14" height="48" fill="#F2F2F4" fill-opacity="0.75"/>
