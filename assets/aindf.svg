    <text x="48" y="352" fill="#909099" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">aindf.oleg.design</text>
    <text x="48" y="376" fill="#68686F" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">MIT · not a component library</text>
